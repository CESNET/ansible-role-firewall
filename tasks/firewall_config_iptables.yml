---
- name: "set up IPv4 iptables rules"
  ansible.builtin.template:
    backup: true
    src: rules.v4.j2
    dest: /etc/iptables/rules.v4
    validate: /sbin/iptables-restore --test '%s'
  register: ipv4_rules

- name: "set up IPv6 iptables rules"
  ansible.builtin.template:
    backup: true
    src: rules.v6.j2
    dest: /etc/iptables/rules.v6
    validate: /sbin/ip6tables-restore --test '%s'
  register: ipv6_rules

- name: "activate iptables rules"
  ansible.builtin.systemd:
    name: iptables
    state: restarted
  when: ipv4_rules.changed or ipv6_rules.changed

- name: "check for system running"
  block:
    - name: "run systemd is-system-running"
      ansible.builtin.command: systemctl is-system-running
      register: system_state
      changed_when: false
      failed_when: false

    - name: "warning if system is not running"
      ansible.builtin.debug:
        msg: >-
          systemd is in the state '{{ system_state.stdout }}' instead of 'running' because of ordering cycle,
          run the following commands to fix:
          systemctl is-system-running;
          systemctl list-jobs;
          journalctl -b --grep 'ordering cycle';
          systemctl start cloud-init-network.service;
          sleep 10;
          systemctl is-system-running
      changed_when: true # causes orange color
      when: system_state.stdout != 'running'

