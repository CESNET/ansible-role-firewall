---
- name: "set up IPv4 iptables rules"
  template:
    backup: true
    src: rules.v4.j2
    dest: /etc/iptables/rules.v4
    validate: /sbin/iptables-restore --test '%s'
  register: ipv4_rules

- name: "set up IPv6 iptables rules"
  template:
    backup: true
    src: rules.v6.j2
    dest: /etc/iptables/rules.v6
    validate: /sbin/ip6tables-restore --test '%s'
  register: ipv6_rules

- name: "activate iptables rules"
  systemd:
    name: iptables
    state: restarted
  when: ipv4_rules.changed or ipv6_rules.changed
